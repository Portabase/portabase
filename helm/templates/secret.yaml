{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "portabase.fullname" . }}
  labels:
    {{- include "portabase.labels" . | nindent 4 }}
type: Opaque
stringData:
  PROJECT_SECRET: {{ .Values.project.secret | quote }}
  {{- with .Values.database.url }}
  DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.smtp.user }}
  SMTP_USER: {{ . | quote }}
  {{- end }}
  {{- with .Values.smtp.password }}
  SMTP_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- range $protocol, $providers := dict "oidc" .Values.auth.oidc "oauth2" .Values.auth.oauth2 }}
  {{- range $name, $provider := $providers }}
  {{- $prefix := include "portabase.authPrefix" (dict "protocol" $protocol "name" $name) }}
  {{- range $field := list "client" "secret" }}
  {{- with index $provider $field }}
  {{ printf "%s_%s" $prefix ($field | upper) }}: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
