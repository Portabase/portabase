# Override the chart name used in resource names. Defaults to the chart name "portabase".
nameOverride: ""
# Override the full resource name (normally "<release>-portabase").
fullnameOverride: ""

image:
  repository: portabase/portabase
  # Defaults to Chart.appVersion when empty.
  tag: ""
  pullPolicy: Always

replicaCount: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 80
  # Only used when service.type is NodePort. Leave empty to let Kubernetes assign one.
  nodePort: ""

resources:
  requests:
    memory: "1Gi"
    cpu: "1"
  limits:
    memory: "1Gi"
    cpu: "1"

timezone: Europe/Paris

project:
  url: http://localhost:8887
 
  secret: "change_me_generate_secure_secret"
  behindProxy: false

# Existing Secret containing PROJECT_SECRET and optional DATABASE_URL, SMTP_USER,
# SMTP_PASSWORD and authentication credentials. When set, leave the corresponding
# inline values empty (including auth provider client and secret fields).
existingSecret: ""

database:
  # Leave empty to use the internal database. Stored in the chart's Secret.
  url: ""

cleanup:
  jobLogs:
    enabled: false
    cron: "0 0 * * *"
    # Positive integer required when enabled. No retention is set by default.
    retentionDays: ""
    batchSize: 1000
  backups:
    enabled: false
    cron: "0 0 * * *"
    # Positive integer required when enabled. No retention is set by default.
    retentionDays: ""
    batchSize: 100

smtp:
  host: ""
  port: ""
  # Credentials are stored in the chart's Secret.
  user: ""
  password: ""
  from: ""
  secure: true

# Provider names must use lowercase letters, digits and underscores.
# Use "default" for unprefixed AUTH_OIDC_* / AUTH_SOCIAL_* variables.
auth:
  allowedGroup: ""
  roleMap: ""
  # null leaves the application's default unchanged; false is explicitly emitted.
  emailPasswordEnabled: null
  signupEnabled: null
  passkeyEnabled: null
  syncOidcRolesOnLogin: null
  trustedDomains: ""
  allowLinking: null
  allowUnlinking: null
  oidc: {}
  # Example provider:
  #   keycloak:
  #     id: keycloak
  #     title: Company SSO
  #     issuerUrl: https://sso.example.com/realms/main
  #     client: portabase
  #     secret: ""
  #     scopes: openid profile email
  #     pkce: true
  #     # Optional overrides of the global account linking settings.
  #     allowLinking: false
  #     allowUnlinking: false
  oauth2: {}
  # Example provider:
  #   github:
  #     client: ""
  #     secret: ""
  #     title: GitHub

persistence:
  enabled: true
  storageClassName: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /data

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: portabase.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Deployment update strategy.
# Default is Recreate: Portabase uses a single ReadWriteOnce PVC, which cannot be
# attached to two pods at once. A RollingUpdate would spin up a new pod before the
# old one terminates, causing a "Multi-Attach" error. Recreate stops the old pod
# first. See https://github.com/Portabase/portabase/issues/411
updateStrategy:
  type: Recreate
  # Only used when type is RollingUpdate. Keep maxSurge at 0 to avoid Multi-Attach
  # errors on the shared ReadWriteOnce volume.
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
