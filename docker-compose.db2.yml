name: portabase-db2-test

# Local IBM Db2 Community Edition for testing the Db2 integration. Dev only:
# throwaway credentials, bound to loopback.
#   docker compose -f docker-compose.db2.yml up -d
#   docker compose -f docker-compose.db2.yml logs -f db2   # ready on "Setup has completed."
# Connect from the dashboard: host.docker.internal / 50000 / db2inst1 / password / TESTDB

services:
  db2:
    image: icr.io/db2_community/db2:12.1.0.0
    container_name: portabase-db2-test
    privileged: true
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: password
      DBNAME: TESTDB
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
    ports:
      - "127.0.0.1:50000:50000"
    volumes:
      - db2-data:/database
    healthcheck:
      test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to TESTDB' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 5m

volumes:
  db2-data:
