services:
  app:
    build:
      context: .
      dockerfile: docker/dockerfile/Dockerfile
    environment:
      DATABASE_URL: postgres://devuser:changeme@db:5432/devdb
    env_file:
      - .env
    volumes:
      - portabase-private:/data/private
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      db:
        condition: service_healthy
    container_name: portabase-app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  tusd:
    image: tusproject/tusd:v2.10.0
    user: "1001:1001"
    command: >
      --base-path /tus/files/
      --upload-dir /data/private/uploads/tmp
      --hooks-http http://app:3000/api/tus/hooks
      --port 1080
      --max-size 21474836480
      --behind-proxy
    volumes:
      - portabase-private:/data/private
    depends_on:
      - app
    container_name: portabase-tusd

  nginx:
    image: nginx:1.31-trixie
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8887:80"
    depends_on:
      - app
      - tusd
    container_name: portabase-nginx

  db:
    image: postgres:18.4-trixie
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=devdb
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=changeme
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d devdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  portabase-private:
  postgres-data:
